<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tricks</title>
    <style>
    
    .box1{
        width:100px;
        height:100px;
        background-color:rgb(240, 6, 6);
        animation:MT 2s linear infinite alternate;
        margin-top: 30%;
        margin-left: 30%;
    }

    
        @keyframes MT {
        0%{

        }
        
        25%{
        border-radius:25%;
        background-color: blue;
        transform:rotate(45deg);
        width:200px;
        height:200px;
        }
        100%{
        border-radius:50%;
        background-color: green;
        transform: rotate(90deg);
        width:400px;
        height:400px;

        }
        
        }



    

    
       
    </style>
</head>
<body>
    <div class="box1"></div>
        
    
    
</body>
</html>
