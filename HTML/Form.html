<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1><center>Form</center></h1>

    <form action="" align="center" mothod="get">
      
        
        <p> <input type="text" name="user-name" placeholder="user name" size="30" maxlength="15"></p>

        <p><input type="password" name="password" placeholder="password" size="30"></p>

        <textarea name="Comments" placeholder="Comments" id=""cols="30" rows="10"></textarea>

        <p><input type="submit" value="Log in" size="30"></p>



    </form>

    <br><br><br><hr>

     <h1><center><u>Student Application</u></center></h1>

     <from method="get" action="">

      <fieldset>
        <legend><h2>Student Application</h2></legend>
      

      <p><label for="name" >Name:</label><br>
         <input type="text" name="name" size="40" id="name"></p>

         <p> <label for="email">Email:</label><br>
            <input type="email" size="40" id="email">
         </p>
      </fieldset>
      <fieldset>
       <legend><h2>Personal Information</h2></legend>
         <p>
            <label for="Address" >Address:</label><br>
            <textarea name="Address" id="Address" cols="30" rows="5"></textarea>
         </p>

         <p>
           <label>Gender:</label><br>
            <input type="radio" name="gender" value="male" checked="checked" id="male"><label for="male">Male</label>
            <input type="radio" name="gender" value="female" id="female"><label for="female">Female</label>
         </p>
         
     <p>
       Date of Birth:
       <input type="date" name="dob">
     </p>
   </fieldset>
   <fieldset>
     <legend><h2>Educational Information</h2></legend>
   <p>
    <label>Courses:</label><br>
      <input type="checkbox"
      name="Web Development" id="NE"><label for="NE"> Web Development</label>
  <br>
      
      <input type="checkbox"
      name="Network Engineering"  id="NW"><label for="NW"> Network Engineering</label>
    <br>
      
      <input type="checkbox"
      name="AI" id="AI"><label for="AI">AI</label>
   <br>
      
      <input type="checkbox"
      name="CS" id="CS"><label for="CS">CS</label>
     </p>
     
    

     <p>
      Certificate:
      <input type="file" name="certificate">
     </p>
</fieldset>

      <br>
     <p><input type="submit" name="Submit" value="Submit" size="30"></p>
     

     
      
     

     </from>


</body>
</html>
