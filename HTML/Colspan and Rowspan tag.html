<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Tag</title>
</head>
<body>
    <h1><center><u>Table Tag</u></center></h1>
    <h2><u>Colspan Tag</u></h2>

    <table border="1px"cellpadding="4px">
        <tr>
            <th colspan="4">Title</th>
        </tr>
        <tr>
            <th colspan="2">SubTitle</th>
            <th colspan="2">SubTitle</th>
        </tr>

        <tr>
            <td>1 item<br>
                1 item<br>
                1 item
            </td>
            <td>
                123<br>
                123<br>
                123
            </td>

          <td>1 item<br>
                1 item<br>
                1 item
            </td>
            <td>
                123<br>
                123<br>
                123
            </td>

        </tr>

        <tr>
            <th colspan="2">Sub Title</th>
            <th colspan="2">Sub Title</th>
        </tr>

    </table>
    <br><br><br>
    <hr>
    <br>

    <h2><u>Rowspan Tag</u></h2>

    <table border="1px"cellpadding="5px">
        
        <tr>
            <td><u>ID</u></td>
            <td><u>Name</u></td>
            <td><u>Subject</u></td>
            <td><u>Marks</u></td>
        </tr>
        
    <tr>
        <td rowspan="3">1</td>
        <td rowspan="3">Devid</td>
        <td>Maths</td>
        <td>80</td>
    </tr>

    <tr>
        
        
        <td>Physics</td>
        <td>90</td>
    </tr>

    <tr>
        
        <td>Computer</td>
        <td>70</td>
    </tr>

    <tr>
        <td rowspan="3">2</td>
        <td rowspan="3">Alex</td>
        <td>Maths</td>
        <td>80</td>
    </tr>

    <tr>
       
        <td>Physics</td>
        <td>70</td>
    </tr>

    <tr>
       
        <td>Computer</td>
        <td>90</td>
    </tr>

    </table>

</body>
</html>
