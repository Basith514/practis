<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Field</title>
</head>
<body>
    <h1><center>Form Field Tag</center></h1>

    <form action="">
        <p>
            <label for="Name">Name</label>
            <input type="text" name="name" id="name">
        </p>
        <p>
            <label for="Age">age</label>
            <input type="number" name="age" id="age" min="20" max="40">
        </p> 

        <p>
            <label for="range">Price range</label>
            <input type="range" name="range" id="range">
        </p>

         <p>
            <label for="url">Enter The URL</label>
            <input type="url" name="url" id="url">
        </p>
<p>
            <label for="TIME">Enter Class Time</label>
            <input type="time" name="time" id="time">
        </p>
        <p>
            <label for="Time">How many weeks?</label>
            <input type="week" name="time" id="time">
        </p>
        <p>
            <label for="url">Search</label>
            <input type="search" name="url" id="url">
        </p>
        
         <p>
            <input type="submit" name="submit" id="submit">
        </p>


        

    </form>
</body>
</html>
